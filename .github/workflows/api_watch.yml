name: EP2026 API Watch

# The browser-free half of the watcher, running on GitHub's infrastructure.
#
# Be clear about what this can and cannot do. It runs ONLY the Discovery API
# source, because every ticketmaster.ie endpoint — including the resale API
# the page itself calls — returns 403 "dynamic_block" to anything that is not
# a real browser, and a real browser will not run usefully here.
#
# Two limits inherited from GitHub, both measured on this repo:
#   * Scheduled workflows do not run on time. The old '*/5' watcher actually
#     fired every 40-100 minutes. Treat the cron below as a rough hourly.
#   * Runners have datacentre IPs, which is what got the old watcher walled.
#     The Discovery API does not care, which is exactly why this is API-only.
#
# So: a free, always-on safety net that catches a coarse re-release. It cannot
# see a single resale listing that appears and vanishes inside five minutes,
# which is the behaviour actually observed on this event. Do not let a quiet
# inbox from this workflow persuade you that nothing happened.

on:
  schedule:
    - cron: '17 * * * *'   # hourly-ish; a non-zero minute is less contended
  workflow_dispatch:

concurrency:
  group: ep2026-api-watch
  cancel-in-progress: false

# Only needs to read the repo. The old workflow held contents:write so it
# could commit its state file on every run; this one caches state instead.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Two reasons not to run.
      #
      # Without a Discovery key this job has no source it can read, so every
      # run would fail, and four failures in a row would start emailing "the
      # watcher is broken" — true but useless, since the cause is a missing
      # secret rather than anything wrong with Ticketmaster.
      #
      # And the festival ends on 30 August 2026. Nothing here stops on its
      # own, so without a hard date this job keeps polling hourly and mailing
      # twice a day about a finished event, unattended, indefinitely. Cron
      # jobs nobody owns are how you end up with a 2028 inbox full of alerts
      # for a 2026 festival.
      - name: Should this run at all?
        id: guard
        env:
          TM_DISCOVERY_KEY: ${{ secrets.TM_DISCOVERY_KEY }}
          # Last day this runs. The festival opens on the 28th, so a ticket
          # found that morning is still usable; it stops at the end of it.
          # Keep this in step with EP_STOP_AFTER on the Mac.
          STOP_AFTER: '2026-08-28'
        run: |
          today="$(date -u +%F)"

          if [[ "$today" > "$STOP_AFTER" ]]; then
            echo "Today is $today, past $STOP_AFTER — the festival is over."
            echo "This workflow has retired itself. Delete it, or move STOP_AFTER"
            echo "if you are watching a later event."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$TM_DISCOVERY_KEY" ]; then
            echo "No TM_DISCOVERY_KEY secret set — nothing this job can read."
            echo "Get a free key at https://developer.ticketmaster.com/ and add it:"
            echo "  gh secret set TM_DISCOVERY_KEY --repo \$GITHUB_REPOSITORY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: pip install requests

      - name: Restore watcher state
        if: steps.guard.outputs.configured == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.ep2026-watcher/state.json
          key: ep-watcher-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ep-watcher-state-

      - name: Run the API watch
        if: steps.guard.outputs.configured == 'true'
        env:
          EP_USE_BROWSER:     '0'
          # This is the backstop, not the primary watcher. The one on David's
          # Mac already sends an hourly "no luck yet"; if this sent one too he
          # would get two an hour, 48 a day, and stop reading either. Twice a
          # day is enough to prove the backstop is alive. Finding a ticket
          # still alerts immediately — that path is not rate-limited.
          EP_HEARTBEAT_HOURS: '12'
          TM_DISCOVERY_KEY:   ${{ secrets.TM_DISCOVERY_KEY }}
          TM_API_KEY:         ${{ secrets.TM_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
        run: python -m ep_watcher run

      # State is cached rather than committed. The old workflow pushed a
      # commit on every run, which is where ~1000 junk commits came from and
      # did nothing for its scheduling priority.
      - name: Save watcher state
        if: always() && steps.guard.outputs.configured == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ep2026-watcher/state.json
          key: ep-watcher-state-${{ github.run_id }}-${{ github.run_attempt }}
