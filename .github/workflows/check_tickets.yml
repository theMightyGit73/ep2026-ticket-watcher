name: EP2026 Ticket Watcher (RETIRED)

# RETIRED 2026-08-13. Superseded by the ep_watcher package, which runs on
# David's Mac — see README.md.
#
# The schedule is disabled rather than deleted, for the record:
#
#   * This job failed to fetch the page on EVERY run from 2026-06-30 onward —
#     657 consecutive failures over 44 days — because ticketmaster.ie serves
#     datacentre IPs and non-browser clients a 401 identity-verification wall
#     that cloudscraper cannot solve. The runs still reported success, because
#     a failed fetch exited 0.
#   * The '*/5' schedule was fiction. Observed cadence was one run every
#     40-100 minutes: GitHub heavily deprioritises scheduled workflows, and
#     this one pushed a commit on every run, which does not help.
#   * Those pushes are the ~1000 "Update watcher state [skip ci]" commits.
#
# The replacement cannot run here at all: it needs a real, visible Chrome from
# a residential IP. Headless gets 403 and CI runners get 401.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = print result only (no notifications) | test = send test notifications'
        required: false
        default: 'check'
        type: choice
        options:
          - check
          - test

# Needed so the job can commit the small watchdog state file back to the repo.
permissions:
  contents: write

# Defensive only — runs take ~10-20s so overlap is very unlikely, but this
# makes sure a slow run never gets clobbered by the next scheduled trigger.
concurrency:
  group: ep2026-ticket-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install cloudscraper requests
      - name: Run ticket checker
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            if [ "$MODE" = "test" ]; then
              echo "Running TEST mode..."
              python ticket_checker.py --test
            else
              echo "Running CHECK mode (print result, no notifications)..."
              python ticket_checker.py --check
            fi
          else
            echo "Scheduled run — checking Ticketmaster..."
            python ticket_checker.py
          fi
      - name: Commit updated watchdog state (if changed)
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name "ep2026-ticket-watcher-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "Update watcher state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
