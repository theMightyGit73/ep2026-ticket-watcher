# docker compose -f deploy/docker-compose.yml up -d
#
# Put secrets in ~/.ep2026-watcher/env on the host:
#   GMAIL_ADDRESS=...
#   GMAIL_APP_PASSWORD=...
#   NTFY_TOPIC=...
#   TM_DISCOVERY_KEY=...

services:
  watcher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ep-watcher
    restart: unless-stopped

    # Run a real init as PID 1. Without this, xvfb-run itself becomes PID 1,
    # and PID 1 ignores the default signal dispositions its cleanup depends
    # on — so when the Python process finishes, xvfb-run hangs forever
    # holding Xvfb open instead of exiting. The container looks busy while
    # doing nothing at all, which is a genuinely confusing way to fail.
    init: true
    # ${HOME} rather than ~ — Compose substitutes environment variables but
    # does NOT expand a tilde, so "~/..." is read as a literal directory name
    # called "~" and the file is silently not found.
    env_file:
      - ${HOME}/.ep2026-watcher/env

    # This container is the SECOND watcher; the Mac is the first. Both look at
    # the same page, and the point is that they look at DIFFERENT moments — a
    # listing lives about 4.6 minutes against a 6-minute interval, so one
    # watcher sees roughly half of them and two see roughly three quarters,
    # without either raising its own request rate.
    #
    # The role turns the routine post down to match: a report twice a day
    # instead of hourly, and no narration of its own day/night switches. Every
    # urgent alert still fires immediately from both machines — a listing, a
    # basket, a watcher that has stopped working.
    environment:
      EP_ROLE: ${EP_ROLE:-secondary}
      EP_POLL_PHASE: ${EP_POLL_PHASE:-0.5}
      EP_WATCHER_LABEL: ${EP_WATCHER_LABEL:-second watcher}
    volumes:
      - watcher-data:/data
    # Chrome needs more than the default 64MB of shared memory or it will
    # crash on pages of any complexity.
    shm_size: 1gb

volumes:
  watcher-data:
